<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootyCraft - Community</title>
    <script>
        window.location.replace('/frontend/views/dashboard/index.html#community');
    </script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/frontend/views/dashboard/css/dashboard.css">
    <link rel="stylesheet" href="/frontend/shared/css/animations.css">
    <link rel="stylesheet" href="/frontend/shared/css/player-cards.css">
    <link rel="stylesheet" href="/frontend/views/community/css/style.css?v=20260421a">
    <link rel="stylesheet" href="/frontend/shared/css/notifications.css">
</head>

<body class="community-shell" data-dashboard-shell="community">

    
    <div id="loader" class="loader-screen">
        <div class="loader-content">
            <div class="loader-logo">
                <img src="/frontend/assets/images/ui/logo.png" alt="FootyCraft logo" class="loader-logo-img">
            </div>
            <h2 class="loader-text">FOOTYCRAFT</h2>
            <p class="loader-tagline">BUILD YOUR SQUAD</p>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
            <p class="loader-hint" id="loaderHint">Press F11 to enter fullscreen</p>
        </div>
        <div class="loader-sweep"></div>
    </div>

    
    <div id="dashboard" class="dashboard-container">

        
        <header class="dashboard-header">
            <div class="container-fluid">
                <a href="/frontend/views/dashboard/index.html#home" class="brand-capsule" aria-label="FootyCraft home">
                    <img src="/frontend/assets/images/ui/logo.png" alt="FootyCraft logo" class="brand-capsule-logo">
                    <span class="brand-capsule-text">FootyCraft</span>
                </a>
                <section class="soundtrack-widget" id="soundtrackWidget" aria-label="Dashboard soundtrack player">
                    <button class="soundtrack-btn soundtrack-play" id="soundtrackPlayBtn" type="button"
                        aria-label="Play soundtrack">
                        <span class="soundtrack-play-icon">&gt;</span>
                    </button>
                    <img src="/frontend/assets/images/ui/logo.png" alt="Current song cover" class="soundtrack-cover"
                        id="soundtrackCover">
                    <div class="soundtrack-meta">
                        <p class="soundtrack-title" id="soundtrackTitle">FootyCraft Soundtrack</p>
                        <p class="soundtrack-artist" id="soundtrackArtist">Smart DJ Random Mix</p>
                    </div>
                    <button class="soundtrack-btn soundtrack-next" id="soundtrackNextBtn" type="button"
                        aria-label="Play next random track">NEXT</button>
                    <span class="soundtrack-chip" id="soundtrackChip">AUTO MIX</span>
                    <div class="soundtrack-hover-details" id="soundtrackHoverDetails" aria-hidden="true">
                        <p class="soundtrack-hover-title" id="soundtrackHoverTitle">FootyCraft Soundtrack</p>
                        <p class="soundtrack-hover-artist" id="soundtrackHoverArtist">Unknown Artist</p>
                    </div>
                </section>
                <nav class="community-shell-nav" role="navigation" aria-label="Community navigation">
                    <a href="/frontend/views/dashboard/index.html#home" class="community-shell-link community-home-link">
                        Dashboard Home
                    </a>
                    <button class="community-shell-link active" type="button" data-community-filter="general">
                        General
                    </button>
                    <button class="community-shell-link" type="button" data-community-filter="tactics">
                        Tactics
                    </button>
                    <button class="community-shell-link" type="button" data-community-filter="announcement">
                        Announcement
                    </button>
                </nav>
                <div class="header-actions">
                    <button id="notif-btn" class="fc-notif-btn" aria-label="Notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span id="notif-badge" class="fc-notif-badge">0</span>
                    </button>
                    
                    <div id="notif-panel" class="fc-notif-panel" aria-hidden="true">
                        <div class="fc-notif-header">
                            <div class="fc-notif-header-left">
                                <h3 class="fc-notif-title">Notifications</h3>
                                <span id="notif-unread-count" class="fc-notif-count"></span>
                            </div>
                            <div class="fc-notif-header-actions">
                                <button id="notif-mark-read" class="fc-notif-action-btn" title="Mark all as read">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                                    <span>Read all</span>
                                </button>
                                <button id="notif-clear-all" class="fc-notif-action-btn" title="Clear read notifications">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                                    <span>Clear</span>
                                </button>
                            </div>
                        </div>
                        <div class="fc-notif-filters" id="notif-filters">
                            <button class="fc-notif-filter active" data-filter="all">All</button>
                            <button class="fc-notif-filter" data-filter="admin">Admin</button>
                            <button class="fc-notif-filter" data-filter="challenge">Challenges</button>
                            <button class="fc-notif-filter" data-filter="community">Community</button>
                            <button class="fc-notif-filter" data-filter="system">System</button>
                        </div>
                        <div id="notif-list" class="fc-notif-list">
                            <div class="fc-notif-empty">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                <p>Loading notifications...</p>
                            </div>
                        </div>
                        <div class="fc-notif-footer">
                            <span class="fc-notif-footer-label">Quick action</span>
                            <button id="notif-logout" class="fc-notif-logout-btn">Log out</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        
        <div class="bg-stadium"></div>
        <div class="bg-overlay"></div>

        
        <main class="dashboard-main">
            <div class="community-bento-grid">

                
                <div class="community-left-feed">
                    
                    <div class="glass-pill-container">
                        <button class="glass-pill active">All</button>
                        <button class="glass-pill">Tactics</button>
                        <button class="glass-pill">Announcement</button>
                        <button class="glass-pill">General</button>
                    </div>

                    <div class="posts-list">


                    </div>
                </div>

                
                <div class="community-right-widgets">
                    <div class="sticky-wrapper">

                        
                        <div class="glass-tile sleek-command-bar" id="createPostWidget">
                            <div class="command-bar-wrapper">
                                <div class="input-top-row">
                                    <div class="user-avatar-mini">
                                        <img src="/frontend/assets/images/ui/logo.png" alt="My Avatar">
                                    </div>
                                    <div class="input-expand-container">
                                        <input type="text" id="postInputExpander" class="command-bar-input" 
                                            placeholder="Share your tactics or squad..." autocomplete="off">
                                    </div>
                                </div>

                                <div class="command-bar-actions" id="commandBarActions">
                                    <button class="action-icon-btn" title="Media">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="1.5">
                                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                            <polyline points="21 15 16 10 5 21"></polyline>
                                        </svg>
                                        <span>Media</span>
                                    </button>
                                    <button class="action-icon-btn" id="formationSelectBtn" title="Formation">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="1.5">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <path
                                                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                                            </path>
                                            <path d="M2 12h20"></path>
                                        </svg>
                                        <span>Formation</span>
                                    </button>
                                    <button class="action-icon-btn" id="submitPostBtn" title="Submit">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="1.5">
                                            <line x1="22" y1="2" x2="11" y2="13"></line>
                                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                        </svg>
                                        <span>Submit</span>
                                    </button>
                                </div>
                                <div id="selectedFormationInfo" style="display:none; margin-top:10px; padding:8px 10px; border:1px solid rgba(212,175,55,.35); border-radius:10px; background:rgba(212,175,55,.08); color:#f7e6a6; font-size:13px; line-height:1.35;"></div>
                            </div>
                        </div>

                        
                        <div class="glass-tile trending-tactics-widget" id="topContributorsWidget">
                            <h3 class="widget-title">Top Contributors</h3>
                            <ul class="trending-list" id="topContributorsList">
                                <li class="text-center text-muted py-3">Loading contributors...</li>
                            </ul>
                        </div>

                    </div>
                </div>

            </div>
        </main>

        
        <svg width="0" height="0" class="hidden-defs" style="display:none;">
            <defs>
                <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff8d9" />
                    <stop offset="38%" stop-color="#f4d47a" />
                    <stop offset="72%" stop-color="#d4af37" />
                    <stop offset="100%" stop-color="#8e6b1f" />
                </linearGradient>
            </defs>
        </svg>

        
        <div id="postModal" class="post-modal" aria-hidden="true">
            <div class="post-modal-overlay" id="postModalOverlay"></div>
            <div class="post-modal-content">
                <div class="post-modal-header">
                    <h3 id="modalPostTitle">Post</h3>
                    <button id="closePostModal" class="ghost-button" aria-label="Close modal">&times;</button>
                </div>
                <div class="post-modal-body" id="postModalBody">
                    
                </div>
            </div>
        </div>

        
    </div>

    
    <script src="/frontend/shared/js/api.js"></script>
    <script src="/frontend/shared/js/ui-alerts.js?v=20260421a"></script>
    <script src="/frontend/shared/js/player-cards.js"></script>
    <script src="/frontend/shared/js/loader.js"></script>
    <script src="/frontend/views/dashboard/js/dashboard.js"></script>
    <script src="/frontend/views/community/js/script.js?v=20260421a"></script>
    <script src="/frontend/shared/js/notifications.js?v=20260421a"></script>
    <script>if (window.initNotifications) window.initNotifications();</script>
</body>

</html>
